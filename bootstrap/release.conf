# Release settings for dist/bootstrap.sh. Read by bootstrap/build.py.
#
# Format: NAME="value", one per line. Values may contain letters, digits and
# the characters  . _ - : / @ + * and spaces (spaces only where a list is
# expected). No quotes, $ or backslashes inside values. Lines starting with #
# are comments.
#
# When the real case kit and the repository owner are known, this file and
# bootstrap/case-overlay/<case id>/ are the only things that need to change.

# GitHub repository that serves dist/bootstrap.sh. The build refuses to print
# the student command while REPO_OWNER is the placeholder.
REPO_OWNER="gssasank"
REPO_NAME="ai-dfir-lab"

# Lab version: shown to students, written to lab.conf [lab] version (it is part
# of every readiness code), and used for the git tag v<VERSION> in the URL.
VERSION="1.0.0"

# Claude Code, installed with the official installer at exactly this version.
# The toolkit needs 2.1.295 or later.
CLAUDE_CODE_VERSION="2.1.322"

# Protocol SIFT is fetched from its own repository on the student's machine and
# never copied into ours (it has no licence).
PROTOCOL_SIFT_REPO="https://github.com/teamdfir/protocol-sift.git"
PROTOCOL_SIFT_COMMIT="40bed7a96bfd986ea048c3b2aeb9d788b2f3400c"

# Duke AI Gateway: root URL without /v1. Both model names are listed by the
# gateway's /v1/models and answer on /v1/messages (tested 2026-11-14 with a
# student-type key; see research/2026-11-14-gateway-proof.md).
GATEWAY_BASE_URL="https://litellm.oit.duke.edu"
MODEL_MAIN="claude-haiku-5-5"
MODEL_SMALL="claude-haiku-5-5"

# Claude Code effort level (instructor's choice: low). Written to lab.conf
# [claude] effort and set as CLAUDE_CODE_EFFORT_LEVEL, which Claude Code 2.1.322
# sends as output_config.effort (seen on the wire). One of low, medium, high,
# xhigh, max, auto, or empty for Claude Code's default (medium on Haiku 5.5).
CLAUDE_EFFORT="low"

# Case. The case is installed at /cases/<CASE_ID>/ and its overlay comes from
# bootstrap/case-overlay/<CASE_ID>/.
CASE_ID="szechuan"
CASE_TITLE="Szechuan Sauce"

# File name students download from the course site (a shell pattern), and the
# SHA-256 of every kit zip the script accepts, separated by spaces: the real kit
# szechuan-kit-0.1.0.zip (build/casekit/). The stand-in kit for the mock VM test
# is accepted only by a test build:
#   python3 bootstrap/build.py --test-kit-sha256 <hash> --out <folder>
CASE_KIT_PATTERN="szechuan-kit-*.zip"
CASE_KIT_SHA256="86a32199fc9d506afb785f4f6705be84484f510027dc12d79533fbd1fa4107ed"
# The kit is also committed in this repository at this path. When no accepted
# kit zip is found on the VM, the script downloads it from
# https://raw.githubusercontent.com/<REPO_OWNER>/<REPO_NAME>/v<VERSION>/<CASE_KIT_REPO_PATH>,
# the same release the script itself comes from, and installs it only if its
# SHA-256 is in CASE_KIT_SHA256.
CASE_KIT_REPO_PATH="kit/szechuan-kit-0.1.0.zip"

# The domain controller's disk image (E01), downloaded separately from the
# course site. It holds live malware: it is unpacked under /cases/<CASE_ID>/disk/,
# made root-owned and read-only, and mounted read-only and noexec at
# IMAGE_MOUNT_POINT by `dfir-lab mount`. IMAGE_ZIP_PATTERN is searched like the
# kit (newest file in ~/Downloads, ~/Desktop, ~); the zip must have exactly
# IMAGE_ZIP_SIZE bytes and IMAGE_ZIP_SHA256. IMAGE_FILES lists the files taken
# from the zip's folder IMAGE_ZIP_DIR, with their SHA-256 after unpacking;
# IMAGE_UNPACKED_BYTES is their total size. The segments keep their long names
# and get short links IMAGE_SHORT_NAME.E01, .E02 (/cases/szechuan/disk/DC01.E01).
# Hashes measured in a SIFT VM on 2026-11-15.
IMAGE_ZIP_PATTERN="DC01-E01*.zip"
IMAGE_ZIP_NAME="DC01-E01.zip"
IMAGE_ZIP_SIZE="4836649413"
IMAGE_ZIP_SHA256="efe06d12388dbc000fa4ae306746ddaca3893a6cdbd55311b52f5833e717acd9"
IMAGE_ZIP_DIR="E01-DC01"
IMAGE_FILES="20200918_0347_CDrive.E01:c0c8fe58dcdb65f6574cb63b34f086856087cfaf06872ed702a4c0c264446bac 20200918_0347_CDrive.E02:73f87df9de0fa9ed41c6fdc360f0e15c3d13955e7fd24f5e59a5b2e282d6b384 20200918_0347_CDrive.E01.txt:af08169bc8c32b27fbaa85f26646f8c1bb9f5f71f0ee04a759f9064928c8ca79"
IMAGE_UNPACKED_BYTES="4872432596"
IMAGE_SHORT_NAME="DC01"
IMAGE_MOUNT_POINT="/mnt/dc01"
